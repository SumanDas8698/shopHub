<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo">
      <i class="bi bi-shield-lock-fill"></i> Shop<span class="accent">Hub</span>
    </div>
    <h2>Create Admin Account</h2>

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" name="username" [(ngModel)]="username" required>
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" [(ngModel)]="email" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" [(ngModel)]="password" required>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" name="confirmPassword" [(ngModel)]="confirmPassword" required>
      </div>

      <button type="submit" class="btn btn-mp-orange" [disabled]="isSubmitting">
        <span *ngIf="!isSubmitting">Create Account</span>
        <span *ngIf="isSubmitting"><span class="spinner-border spinner-border-sm"></span> Creating...</span>
      </button>
    </form>

    <div class="auth-divider"></div>

    <p class="auth-switch">
      Already have an account? <a routerLink="/admin-login">Sign in</a>
    </p>
  </div>
</div>
