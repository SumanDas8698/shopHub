<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo">
      <i class="bi bi-bag-check-fill"></i> Shop<span class="accent">Hub</span>
    </div>
    <h2>Sign In</h2>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" [(ngModel)]="email" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" [(ngModel)]="password" required>
      </div>

      <button type="submit" class="btn btn-mp-yellow" [disabled]="isSubmitting">
        <span *ngIf="!isSubmitting">Sign In</span>
        <span *ngIf="isSubmitting"><span class="spinner-border spinner-border-sm"></span> Signing in...</span>
      </button>
    </form>

    <div class="auth-divider"></div>

    <p class="auth-switch">
      New to ShopHub? <a routerLink="/user-register">Create your account</a>
    </p>
    <p class="auth-switch">
      <a routerLink="/admin-login">Admin login instead &rarr;</a>
    </p>
  </div>
</div>
