<div class="admin-shell">
  <div class="admin-page-head">
    <div class="eyebrow">Admin / Catalog</div>
    <h1>Add New Product</h1>
    <p>List a new product on the storefront.</p>
  </div>

  <div class="upload-grid">
    <!-- Form -->
    <div class="admin-card">
      <form (ngSubmit)="upload()">
        <div class="form-group">
          <label class="form-label">Product Name</label>
          <input type="text" class="form-control" name="name" [(ngModel)]="name" required>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="3" name="description" [(ngModel)]="description" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Selling Price (&#8377;)</label>
            <input type="number" min="0" step="0.01" class="form-control" name="price" [(ngModel)]="price" required>
          </div>
          <div class="form-group">
            <label class="form-label">MRP (&#8377;) <span class="optional-tag">optional</span></label>
            <input type="number" min="0" step="0.01" class="form-control" name="mrp" [(ngModel)]="mrp">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Stock Quantity</label>
            <input type="number" min="0" class="form-control" name="stock" [(ngModel)]="stock">
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <select class="form-select" name="categoryId" [(ngModel)]="categoryId">
              <option value="">-- Select Category --</option>
              <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Product Image</label>
          <input #fileInput type="file" accept="image/*" class="form-control" (change)="onFileChange($event)" required>
        </div>

        <button type="submit" class="btn btn-mp-orange btn-lg w-100" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting"><i class="bi bi-plus-circle"></i> Add Product</span>
          <span *ngIf="isSubmitting"><span class="spinner-border spinner-border-sm"></span> Uploading...</span>
        </button>
      </form>
    </div>

    <!-- Preview -->
    <div class="admin-card preview-card">
      <h6>Live Preview</h6>
      <div class="preview-img-box">
        <img *ngIf="imagePreview" [src]="imagePreview" alt="Preview">
        <div *ngIf="!imagePreview" class="preview-placeholder">
          <i class="bi bi-image"></i>
          <span>Image preview</span>
        </div>
      </div>
      <p class="preview-name">{{ name || 'Product name' }}</p>
      <div class="preview-price-row" *ngIf="price">
        <span class="price">&#8377;{{ price }}</span>
        <span class="price-mrp" *ngIf="mrp && mrp > price">&#8377;{{ mrp }}</span>
      </div>
    </div>
  </div>
</div>
